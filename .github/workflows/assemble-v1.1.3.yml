name: Finalize v1.1.3 release assets

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, 'Finalize v1.1.3 release assets')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Rebuild and verify large release files
        run: python .github/assemble_v1_1_3.py
      - name: Commit complete release assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Finalize v1.1.3 release assets [skip ci]"
          git push
